name: inversiones
description: "App de Inversiones JS"
publish_to: 'none'

version: 1.0.1+4

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.13.1
  device_info_plus: ^10.1.0
  uuid: ^4.5.2  
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Agregamos la herramienta para generar iconos
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true
  # Registramos el asset del logo
  assets:
    - assets/icon/Logo.png

# Configuración del icono para la app de Inversiones
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/Logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A237E" # Azul profundo para inversiones
  adaptive_icon_foreground: "assets/icon/Logo.png"